<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L'Imperial Luxury — Purchase & Sales Tracking</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090c12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Limperial">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #cbd5e1; }
        
        .custom-scrollbar-x::-webkit-scrollbar { height: 10px; }
        .custom-scrollbar-x::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; margin-inline: 16px; }
        .custom-scrollbar-x::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid #f1f5f9; }
        .custom-scrollbar-x:hover::-webkit-scrollbar-thumb { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5xiXDkzznQr8OBDnqUf22DxMbKT7LDKFFREYzWoZc8ISE21hEPokMJe_NPte2GSyhoQFxJ6Xq5nqo/pub?gid=0&single=true&output=csv";

        const cleanKey = (str) => String(str).replace(/[^a-z0-9]/gi, '').toLowerCase();

        const extractCol = (row, exactMatches, fuzzyMatches = []) => {
            if (!row) return undefined;
            const keys = Object.keys(row);
            
            for (let match of exactMatches) {
                const cleanMatch = cleanKey(match);
                const found = keys.find(k => cleanKey(k) === cleanMatch);
                if (found && row[found] !== undefined && String(row[found]).trim() !== "") return row[found];
            }
            
            for (let match of fuzzyMatches) {
                const cleanMatch = cleanKey(match);
                const found = keys.find(k => cleanKey(k).includes(cleanMatch));
                if (found && row[found] !== undefined && String(row[found]).trim() !== "") return row[found];
            }
            
            return undefined;
        };

        const parseCurrency = (val) => {
            if (!val) return 0;
            const parsed = parseFloat(String(val).replace(/[^0-9.-]+/g, ""));
            return isNaN(parsed) ? 0 : parsed;
        };

        const getImageUrl = (url) => {
            if (!url) return null;
            const match = url.match(/[-\w]{25,}/);
            if (match) {
                return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w400`;
            }
            return url;
        };

        const Dashboard = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const [isManager, setIsManager] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [passcode, setPasscode] = useState("");
            const [authError, setAuthError] = useState("");

            const [searchTerm, setSearchTerm] = useState("");
            const [activeTab, setActiveTab] = useState("Status Timeline");
            const [statusFilter, setStatusFilter] = useState("All Active");
            
            const [expandedPOs, setExpandedPOs] = useState({});
            const [targetScrollPO, setTargetScrollPO] = useState(null);

            const scrollRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [dragged, setDragged] = useState(false);
            const [startX, setStartX] = useState(0);
            const [scrollLeftVal, setScrollLeftVal] = useState(0);

            const onMouseDown = (e) => {
                if (!scrollRef.current) return;
                setIsDragging(true);
                setDragged(false);
                setStartX(e.pageX - scrollRef.current.offsetLeft);
                setScrollLeftVal(scrollRef.current.scrollLeft);
            };
            const onMouseLeave = () => setIsDragging(false);
            const onMouseUp = () => setIsDragging(false);
            const onMouseMove = (e) => {
                if (!isDragging || !scrollRef.current) return;
                e.preventDefault();
                setDragged(true);
                const x = e.pageX - scrollRef.current.offsetLeft;
                const walk = (x - startX) * 1.5; 
                scrollRef.current.scrollLeft = scrollLeftVal - walk;
            };

            useEffect(() => {
                if (activeTab === 'Orders' && targetScrollPO) {
                    const timer = setTimeout(() => {
                        const el = document.getElementById(`po-card-${cleanKey(targetScrollPO)}`);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            el.classList.add('ring-4', 'ring-brand-400', 'shadow-2xl', 'scale-[1.02]', 'bg-brand-50', 'z-10', 'relative', 'transition-all', 'duration-500');
                            setTimeout(() => {
                                el.classList.remove('ring-4', 'ring-brand-400', 'shadow-2xl', 'scale-[1.02]', 'bg-brand-50', 'z-10', 'relative');
                            }, 2000);
                        }
                        setTargetScrollPO(null);
                    }, 150);
                    return () => clearTimeout(timer);
                }
            }, [activeTab, targetScrollPO]);

            const togglePO = (po, event) => {
                if (dragged) return;
                if (event) event.stopPropagation();
                
                setExpandedPOs(prev => {
                    const isCurrentlyOpen = !!prev[po];
                    if (isCurrentlyOpen) return {}; 
                    
                    if (event && event.currentTarget) {
                        const targetEl = event.currentTarget.closest('.expandable-card');
                        if (targetEl) {
                            setTimeout(() => {
                                targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                            }, 150);
                        }
                    }
                    return { [po]: true };
                });
            };

            const jumpToOrder = (poNumber, event) => {
                if (event) event.stopPropagation();
                setExpandedPOs({ [poNumber]: true }); 
                setTargetScrollPO(poNumber); 
                setActiveTab('Orders'); 
            };

            const fetchData = () => {
                setLoading(true);
                setError(null);
                Papa.parse(CSV_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const validData = results.data.filter(row => Object.values(row).some(val => val !== ""));
                        setData(validData);
                        setLoading(false);
                    },
                    error: (err) => {
                        setError("Failed to sync live data: " + err.message);
                        setLoading(false);
                    }
                });
            };

            useEffect(() => { fetchData(); }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passcode === "300920") {
                    setIsManager(true);
                    setShowAuthModal(false);
                    setPasscode("");
                    setAuthError("");
                    setActiveTab("Account Payable");
                } else {
                    setAuthError("Invalid passcode.");
                }
            };

            const processedData = useMemo(() => {
                let lastPo = "";
                return data.map(row => {
                    let rawPo = extractCol(row, ['PONumber', 'PO', 'OrderNo', 'POOrder'], ['PO']);
                    let rawClient = extractCol(row, ['DestinationClient', 'Client', 'Customer', 'Destination']);
                    let rawAgent = extractCol(row, ['SalesRepAgent', 'Agent', 'SalesRep']);
                    let rawBrand = extractCol(row, ['Brand', 'Supplier', 'Manufacturer', 'Vendor']);
                    let rawShippingAgent = extractCol(row, ['ShippingAgent', 'Forwarder', 'Logistics']);
                    
                    let poNumber = rawPo ? String(rawPo).trim().toUpperCase() : lastPo;
                    if (poNumber) lastPo = poNumber;

                    let rawQtyVal = extractCol(row, ['Qty', 'Quantity']);
                    let parsedQty = parseInt(rawQtyVal) || 1; 
                    
                    let totalCostRaw = extractCol(row, ['TotalCost', 'TotalCost']);
                    let totalCost = totalCostRaw ? parseCurrency(totalCostRaw) : 0;
                    
                    let unitCostRaw = extractCol(row, ['UnitCost', 'UnitCost']);
                    let unitCost = unitCostRaw ? parseCurrency(unitCostRaw) : (totalCost / parsedQty);
                    
                    let unitShippingRaw = extractCol(row, ['ShippingCost', 'ShippingCost']);
                    let unitShipping = unitShippingRaw ? parseCurrency(unitShippingRaw) : 0;
                    
                    let totalShippingRaw = extractCol(row, ['TotalShippingCost', 'TotalShippingCost']);
                    let totalShipping = totalShippingRaw !== undefined ? parseCurrency(totalShippingRaw) : (unitShipping * parsedQty);
                    
                    let landedUnitCostRaw = extractCol(row, ['LandedUnitCost', 'LandedUnitCost']);
                    let landedUnitCost = landedUnitCostRaw ? parseCurrency(landedUnitCostRaw) : (unitCost + unitShipping);
                    
                    let totalLandedCost = totalCost + totalShipping;

                    return {
                        poNumber: poNumber || 'Unknown PO',
                        status: extractCol(row, ['CargoStatus', 'Status', 'Stage']),
                        sku: extractCol(row, ['SKUCode', 'SKU', 'ItemCode']),
                        itemDescription: extractCol(row, ['ItemDescription', 'Description', 'Item']),
                        imageLink: getImageUrl(extractCol(row, ['ImageLink', 'Image', 'Photo'])),
                        qty: rawQtyVal,
                        parsedQty: parsedQty,
                        arrivalDate: extractCol(row, ['EstArrivalDate', 'Arrival', 'Date']),
                        client: rawClient ? String(rawClient).trim() : "",
                        agent: rawAgent ? String(rawAgent).trim() : "",
                        brand: rawBrand ? String(rawBrand).trim() : "",
                        shippingAgent: rawShippingAgent ? String(rawShippingAgent).trim() : "",
                        category: extractCol(row, ['Category', 'Type', 'Class']),
                        targetPrice: extractCol(row, ['TargetSellingPrice', 'SellingPrice']),
                        
                        totalCost: totalCost,
                        unitCost: unitCost,
                        totalShipping: totalShipping,
                        unitShipping: unitShipping,
                        landedUnitCost: landedUnitCost,
                        totalLandedCost: totalLandedCost,
                        deposit: parseCurrency(extractCol(row, ['DepositAmountPaid', 'Deposit'])),
                        balance: parseCurrency(extractCol(row, ['BalanceDue', 'BalancesDue', 'Balance'])),
                        depositDueDate: extractCol(row, ['DepositDueDate', 'DepositDue', 'DueDate', 'DateDue'])
                    };
                });
            }, [data]);

            const filteredData = useMemo(() => {
                return processedData.filter(item => {
                    if (!isManager) {
                        const isAsset = (item.client || "").toLowerCase().includes("asset") || 
                                        (item.client || "").toLowerCase().includes("personal") ||
                                        (item.category || "").toLowerCase().includes("asset") || 
                                        (item.category || "").toLowerCase().includes("personal");
                        if (isAsset) return false;
                    }

                    const matchesSearch = 
                        (item.poNumber || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.client || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.itemDescription || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.agent || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.brand || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.shippingAgent || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (item.sku || "").toLowerCase().includes(searchTerm.toLowerCase());
                    
                    let matchesStatus = true;
                    if (statusFilter !== "All Active") {
                        if (statusFilter.toLowerCase() === 'pending') {
                            matchesStatus = (item.status || "").toLowerCase().includes('pending') || (item.status || "").toLowerCase().includes('placed');
                        } else {
                            matchesStatus = (item.status || "").toLowerCase().includes(statusFilter.toLowerCase());
                        }
                    }
                    
                    return matchesSearch && matchesStatus;
                });
            }, [processedData, searchTerm, statusFilter, isManager]);

            const groupedOrders = useMemo(() => {
                const groups = {};
                filteredData.forEach(item => {
                    const po = item.poNumber;
                    if (!groups[po]) {
                        groups[po] = {
                            poNumber: po,
                            agent: item.agent,
                            brand: item.brand,
                            shippingAgent: item.shippingAgent,
                            status: item.status,
                            arrivalDate: item.arrivalDate,
                            depositDueDate: item.depositDueDate,
                            items: [],
                            totalCost: 0,
                            totalShippingCost: 0,
                            totalDeposit: 0,
                            totalBalance: 0,
                            totalQty: 0
                        };
                    }
                    groups[po].items.push(item);
                    
                    if (!groups[po].brand && item.brand) groups[po].brand = item.brand;
                    if (!groups[po].shippingAgent && item.shippingAgent) groups[po].shippingAgent = item.shippingAgent;
                    if (!groups[po].depositDueDate && item.depositDueDate) groups[po].depositDueDate = item.depositDueDate;
                    if (!groups[po].arrivalDate && item.arrivalDate) groups[po].arrivalDate = item.arrivalDate;
                    
                    groups[po].totalCost += item.totalCost || 0;
                    groups[po].totalShippingCost += item.totalShipping || 0;
                    groups[po].totalDeposit += item.deposit || 0;
                    groups[po].totalBalance += item.balance || 0;
                    groups[po].totalQty += item.parsedQty || 0;
                });
                
                return Object.values(groups).map(group => {
                    group.uniqueClients = Array.from(new Set(group.items.map(i => i.client && i.client.trim()).filter(Boolean)));
                    return group;
                }).sort((a, b) => {
                    const statusA = (a.status || "").toLowerCase();
                    const statusB = (b.status || "").toLowerCase();
                    const aIsDone = statusA.includes('arrived') || statusA.includes('completed') || statusA.includes('delivered');
                    const bIsDone = statusB.includes('arrived') || statusB.includes('completed') || statusB.includes('delivered');
                    if (aIsDone && !bIsDone) return 1;
                    if (!aIsDone && bIsDone) return -1;
                    
                    let timeA = Infinity;
                    let timeB = Infinity;
                    if (a.arrivalDate) {
                        let p = new Date(a.arrivalDate).getTime();
                        if (!isNaN(p)) timeA = p;
                    }
                    if (b.arrivalDate) {
                        let p = new Date(b.arrivalDate).getTime();
                        if (!isNaN(p)) timeB = p;
                    }
                    return timeA - timeB;
                });
            }, [filteredData]);

            const pipelineData = useMemo(() => {
                const columns = [
                    { id: 'placed', title: 'Order Placed', color: 'bg-gray-100 text-gray-700 border-gray-200', dot: 'bg-gray-400', items: [] },
                    { id: 'production', title: 'In Production', color: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'bg-amber-500', items: [] },
                    { id: 'shipping', title: 'Shipping', color: 'bg-blue-50 text-blue-700 border-blue-200', dot: 'bg-blue-500', items: [] },
                    { id: 'arrived', title: 'Arrived / Completed', color: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500', items: [] },
                    { id: 'other', title: 'Other Status', color: 'bg-gray-100 text-gray-700 border-gray-200', dot: 'bg-gray-500', items: [] }
                ];

                groupedOrders.forEach(order => {
                    const s = (order.status || "").toLowerCase();
                    if (s.includes('place') || s.includes('pending')) columns[0].items.push(order);
                    else if (s.includes('production')) columns[1].items.push(order);
                    else if (s.includes('ship') || s.includes('transit')) columns[2].items.push(order);
                    else if (s.includes('arriv') || s.includes('complet') || s.includes('deliver')) columns[3].items.push(order);
                    else columns[4].items.push(order);
                });

                if (columns[4].items.length === 0) columns.pop();

                const arrivedCol = columns.find(c => c.id === 'arrived');
                if (arrivedCol) {
                    arrivedCol.items.sort((a, b) => {
                        let tA = new Date(a.arrivalDate).getTime();
                        let tB = new Date(b.arrivalDate).getTime();
                        if (isNaN(tA)) tA = 0;
                        if (isNaN(tB)) tB = 0;
                        return tB - tA;
                    });
                }

                return columns;
            }, [groupedOrders]);

            const timelineData = useMemo(() => {
                const groups = {};
                const tbdOrders = [];
                
                groupedOrders.forEach(order => {
                    const dateStr = order.arrivalDate;
                    if (!dateStr || dateStr.trim().toUpperCase() === "TBD" || dateStr.trim() === "") {
                        tbdOrders.push(order);
                        return;
                    }
                    const parsedDate = new Date(dateStr);
                    if (isNaN(parsedDate.getTime())) {
                        tbdOrders.push(order);
                        return;
                    }
                    if (!groups[dateStr]) groups[dateStr] = { dateStr: dateStr, timestamp: parsedDate.getTime(), orders: [] };
                    groups[dateStr].orders.push(order);
                });
                
                let allGroups = Object.values(groups);
                const activeGroups = [];
                const pastGroups = [];
                
                allGroups.forEach(group => {
                    const isCompletelyPast = group.orders.every(o => {
                        const s = (o.status || "").toLowerCase();
                        return s.includes("arrived") || s.includes("completed") || s.includes("delivered");
                    });
                    
                    if (isCompletelyPast) {
                        pastGroups.push(group);
                    } else {
                        activeGroups.push(group);
                    }
                });
                
                activeGroups.sort((a, b) => a.timestamp - b.timestamp);
                pastGroups.sort((a, b) => b.timestamp - a.timestamp);
                
                const finalGroups = [...activeGroups];
                if (tbdOrders.length > 0) {
                    finalGroups.push({ dateStr: "To Be Determined", timestamp: Infinity, orders: tbdOrders });
                }
                
                return finalGroups.concat(pastGroups);
            }, [groupedOrders]);

            const kpis = useMemo(() => {
                let gBalance = 0; let gDeposit = 0; let gCost = 0; let gShipping = 0; let gPending = 0;
                processedData.forEach(item => {
                    const isAsset = (item.client || "").toLowerCase().includes("asset") || (item.category || "").toLowerCase().includes("asset");
                    if (!isManager && isAsset) return;

                    gBalance += item.balance || 0;
                    gDeposit += item.deposit || 0;
                    gCost += item.totalCost || 0;
                    gShipping += item.totalShipping || 0;
                    if ((item.status || '').toLowerCase().includes('pending') || 
                        (item.status || '').toLowerCase().includes('shipping') ||
                        (item.status || '').toLowerCase().includes('placed') ||
                        (item.status || '').toLowerCase().includes('active') ||
                        (item.status || '').toLowerCase().includes('production')) {
                        gPending++;
                    }
                });
                return { balance: gBalance, deposit: gDeposit, cost: gCost, shipping: gShipping, pending: gPending };
            }, [processedData, isManager]);

            const payableOrders = useMemo(() => {
                return groupedOrders
                    .filter(po => po.totalBalance > 0 || (po.totalCost > 0 && po.totalDeposit === 0))
                    .map(po => {
                        let type = (po.totalDeposit === 0 && po.totalCost > 0) ? "Pending Deposit" : "Balance Deposit";
                        let amountDue = po.totalBalance > 0 ? po.totalBalance : po.totalCost;
                        let dateStr = po.depositDueDate || po.arrivalDate;
                        let sortTime = Infinity;
                        if (dateStr) {
                            let parsed = new Date(dateStr).getTime();
                            if (!isNaN(parsed)) sortTime = parsed;
                        }
                        return { ...po, paymentType: type, amountDue, sortTime, displayDate: dateStr };
                    })
                    .sort((a, b) => {
                        if (a.paymentType === "Pending Deposit" && b.paymentType !== "Pending Deposit") return -1;
                        if (a.paymentType !== "Pending Deposit" && b.paymentType === "Pending Deposit") return 1;
                        return a.sortTime - b.sortTime;
                    });
            }, [groupedOrders]);

            const fmtStr = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);

            const getStatusBadgeStyles = (statusStr) => {
                const s = (statusStr || "").toLowerCase();
                if (s.includes('production')) return "bg-amber-50 text-amber-700 border-amber-200";
                if (s.includes('ship') || s.includes('transit')) return "bg-blue-50 text-blue-700 border-blue-200";
                if (s.includes('arriv') || s.includes('complet') || s.includes('deliver')) return "bg-emerald-50 text-emerald-700 border-emerald-200";
                return "bg-gray-100 text-gray-700 border-gray-200";
            };

            return (
                <div className="min-h-screen flex flex-col relative pb-20 font-sans">
                    {/* Unified Master Suite Navigation */}
                    <header className="bg-[#090c12] border-b border-[#dfb26c]/20 sticky top-0 z-40 px-4 py-2.5 shadow-md">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
                            <div className="flex items-center space-x-3">
                                <a href="./index.html" className="flex items-center space-x-2 shrink-0">
                                    <img src="https://lh3.googleusercontent.com/d/1lW4DKT9IDiuo97MxmAgZMKVdLXOUItnf" 
                                         alt="Limperial Luxury" 
                                         class="h-8 w-auto object-contain"
                                         onError={(e) => { e.target.outerHTML = '<div class="h-8 w-8 rounded-full border border-[#dfb26c]/30 flex items-center justify-center bg-gray-900 shrink-0"><i class="fa-solid fa-crown text-[#dfb26c] text-sm"></i></div>'; }} />
                                </a>
                                
                                {/* Desktop Suite Navigation Tabs */}
                                <nav className="hidden md:flex items-center space-x-1 bg-black/30 p-1 rounded-xl border border-[#dfb26c]/20 ml-2">
                                    <a href="./index.html" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-[#dfb26c] hover:bg-white/5 flex items-center gap-1.5 transition-all">
                                        <i className="fa-solid fa-gem text-[11px]"></i><span>Showroom & Quotes</span>
                                    </a>
                                    <a href="./purchase.html" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-[#dfb26c] hover:bg-white/5 flex items-center gap-1.5 transition-all">
                                        <i className="fa-solid fa-receipt text-[11px]"></i><span>Purchases & AR</span>
                                    </a>
                                    <a href="./tracking.html" className="px-3 py-1.5 rounded-lg text-xs font-bold bg-[#dfb26c] text-[#090c12] shadow-sm flex items-center gap-1.5 transition-all">
                                        <i className="fa-solid fa-truck-fast text-[11px]"></i><span>Sales & POs</span>
                                    </a>
                                    <a href="./attendance.html" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-[#dfb26c] hover:bg-white/5 flex items-center gap-1.5 transition-all">
                                        <i className="fa-solid fa-calendar-check text-[11px]"></i><span>Attendance</span>
                                    </a>
                                </nav>
                            </div>

                            <div className="flex items-center space-x-3">
                                <button onClick={fetchData} className="px-2.5 py-1 text-gray-300 hover:text-[#dfb26c] bg-white/5 hover:bg-white/10 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 border border-white/10" title="Refresh Live Data">

                                            className={`expandable-card scroll-mt-24 bg-white rounded-2xl border overflow-hidden transition-all duration-300 mb-6 ${isExpanded ? 'border-brand-200 ring-1 ring-brand-200 shadow-md' : 'border-gray-100 shadow-sm hover:shadow-md'}`}
                                        >
                                            <div 
                                                onClick={(e) => togglePO(order.poNumber, e)}
                                                className="p-5 cursor-pointer hover:bg-gray-50/50 transition-colors"
                                            >
                                                <div className="flex items-center flex-wrap gap-2.5 mb-3">
                                                    <div className={`shrink-0 w-8 h-8 bg-gray-50 rounded-lg border border-gray-200 flex items-center justify-center text-brand-500 mr-2 transition-transform duration-300 ${isExpanded ? 'rotate-180 bg-brand-50 border-brand-100' : ''}`}>
                                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                                    </div>
                                                    
                                                    <span className="font-bold text-gray-900 text-xl tracking-tight">{order.poNumber}</span>
                                                    
                                                    <span className={`px-2.5 py-0.5 rounded text-[10px] sm:text-xs font-bold uppercase tracking-wider border shadow-sm ${statusStyle}`}>
                                                        {order.status || "Unknown"}
                                                    </span>
                                                    
                                                    {order.brand && (
                                                        <span className="px-2.5 py-0.5 rounded text-[10px] sm:text-xs font-semibold border border-indigo-100 bg-indigo-50 text-indigo-600 shadow-sm">
                                                            {order.brand}
                                                        </span>
                                                    )}
                                                    
                                                    <span className="px-2.5 py-0.5 rounded bg-gray-50 text-gray-600 text-[10px] sm:text-xs font-bold border border-gray-200 shadow-sm">
                                                        Total Qty: {order.totalQty}
                                                    </span>
                                                </div>
                                                
                                                <div className="pl-12">
                                                    <div className="text-[13px] sm:text-sm text-gray-800 font-medium mb-1">
                                                        <span className="text-gray-400 mr-1.5">Client(s):</span> 
                                                        {order.uniqueClients?.length > 0 ? order.uniqueClients.join(', ') : "Unspecified"}
                                                    </div>
                                                    
                                                    <div className="text-[11px] sm:text-xs text-gray-500 truncate mb-4">
                                                        <span className="text-gray-400 mr-1.5">Contents:</span>
                                                        {Array.from(new Set(order.items.map(i => i.itemDescription).filter(Boolean))).join(", ") || "No item descriptions"}
                                                    </div>
                                                    
                                                    <div className="flex flex-wrap gap-3">
                                                        {isManager && order.totalBalance > 0 && (
                                                            <div className="flex items-center px-3 py-1.5 rounded-lg bg-rose-50 border border-rose-100 text-rose-700 text-xs font-bold shadow-sm">
                                                                <svg className="w-3.5 h-3.5 mr-1.5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                                Bal. Due: {order.depositDueDate || "TBD"}
                                                            </div>
                                                        )}
                                                        
                                                        <div className="flex items-center px-3 py-1.5 rounded-lg bg-blue-50 border border-blue-100 text-blue-700 text-xs font-bold shadow-sm">
                                                            <svg className="w-3.5 h-3.5 mr-1.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                            ETA: {order.arrivalDate || "TBD"}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            {isExpanded && (
                                                <div className="border-t border-gray-100 bg-gray-50/30 p-5 space-y-4">
                                                    {order.items.map((item, idx) => (
                                                        <div key={idx} className="flex items-start bg-white p-4 rounded-xl border border-gray-100 shadow-sm gap-4">
                                                            <div className="w-16 h-16 sm:w-24 sm:h-24 bg-gray-100 rounded-lg overflow-hidden border border-gray-200 shrink-0 flex items-center justify-center shadow-inner">
                                                                {item.imageLink ? (
                                                                    <img src={item.imageLink} alt={item.sku} className="w-full h-full object-cover" onError={(e) => e.target.style.display = 'none'} />
                                                                ) : (
                                                                    <svg className="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                                )}
                                                            </div>
                                                            <div className="flex flex-col flex-1 min-w-0 justify-center h-full">
                                                                <div className="text-[13px] sm:text-base font-semibold text-gray-900 flex items-center flex-wrap gap-2.5 mb-1.5">
                                                                    <span className="font-bold text-brand-600">{item.qty ? `${item.qty}x ` : ''}</span>
                                                                    {item.sku && <span className="font-mono text-[10px] sm:text-xs text-brand-600 bg-brand-50 px-2 py-0.5 rounded border border-brand-100">{item.sku}</span>}
                                                                    <span className="truncate">{item.itemDescription || "Unnamed Item"}</span>
                                                                </div>
                                                                
                                                                {item.client && (
                                                                    <div className="text-xs text-gray-500 font-medium mb-2 truncate">
                                                                        <span className="text-gray-400">For:</span> {item.client}
                                                                    </div>
                                                                )}
                                                                
                                                                {isManager && (
                                                                    <div className="text-[11px] sm:text-xs text-gray-500 flex gap-2.5 flex-wrap items-center">
                                                                        <span><span className="text-gray-400">Landed:</span> {fmtStr(item.landedUnitCost)}/ea</span>
                                                                        <span className="text-gray-300">|</span>
                                                                        <span className="font-semibold text-gray-700"><span className="text-gray-400 font-normal">Line Total:</span> {fmtStr(item.totalLandedCost)}</span>
                                                                        <span className="text-gray-300">|</span>
                                                                        <span className="text-blue-600 font-medium"><span className="text-blue-400">Ship Total:</span> {fmtStr(item.totalShipping)}</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )})}

                                    {activeTab === 'Items' && [...filteredData]
                                        .sort((a, b) => {
                                            const statusA = (a.status || "").toLowerCase();
                                            const statusB = (b.status || "").toLowerCase();
                                            const aIsDone = statusA.includes('arrived') || statusA.includes('completed');
                                            const bIsDone = statusB.includes('arrived') || statusB.includes('completed');
                                            
                                            if (aIsDone && bIsDone) {
                                                let tA = new Date(a.arrivalDate).getTime();
                                                let tB = new Date(b.arrivalDate).getTime();
                                                if (isNaN(tA)) tA = 0;
                                                if (isNaN(tB)) tB = 0;
                                                return tB - tA; 
                                            }
                                            if (aIsDone && !bIsDone) return 1;
                                            if (!aIsDone && bIsDone) return -1;
                                            return 0;
                                        })
                                        .map((item, index) => (
                                        <div key={index} className="bg-white rounded-xl p-4 sm:p-5 shadow-sm border border-gray-100 flex flex-col lg:flex-row justify-between items-start lg:items-center hover:shadow-md transition-shadow gap-4 mb-4">
                                            <div className="flex items-center space-x-4 flex-1">
                                                <div className="w-16 h-16 sm:w-20 sm:h-20 bg-gray-100 rounded-lg overflow-hidden border border-gray-200 shrink-0 flex items-center justify-center">
                                                    {item.imageLink ? (
                                                        <img src={item.imageLink} alt={item.sku} className="w-full h-full object-cover" onError={(e) => e.target.style.display = 'none'} />
                                                    ) : (
                                                        <svg className="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                    )}
                                                </div>
                                                <div className="flex flex-col flex-1">
                                                    <div className="flex items-center flex-wrap gap-2 mb-1">
                                                        <span 
                                                            onClick={(e) => jumpToOrder(item.poNumber, e)}
                                                            className="font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded cursor-pointer hover:bg-brand-100 transition text-sm"
                                                        >
                                                            {item.poNumber}
                                                        </span>
                                                        <span className="font-bold text-gray-800 text-sm">{item.qty ? `${item.qty}x ` : ''}</span>
                                                        {item.sku && <span className="font-mono text-[10px] sm:text-xs text-brand-700 border border-brand-100 px-1.5 py-0.5 rounded">{item.sku}</span>}
                                                    </div>
                                                    <div className="text-sm font-medium text-gray-900">{item.itemDescription || "Unnamed Item"}</div>
                                                    <div className="text-xs text-gray-400 mt-1">{item.client || "No Client"}</div>
                                                </div>
                                            </div>
                                            <div className="w-full lg:w-auto lg:text-right border-t lg:border-t-0 pt-3 lg:pt-0 border-gray-100 mt-2 lg:mt-0 flex flex-col items-start lg:items-end">
                                                {isManager && (
                                                    <div className="text-right w-full">
                                                        <span className="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-0.5">Line Total (Inc. Ship)</span>
                                                        <span className="text-sm font-semibold text-gray-800">{fmtStr(item.totalLandedCost)}</span>
                                                        <span className="text-[10px] text-gray-400 mt-0.5 block">({fmtStr(item.landedUnitCost)}/ea)</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}

                                    {activeTab === 'Account Payable' && isManager && (
                                        <div className="space-y-3">
                                            {payableOrders.length === 0 ? (
                                                <div className="text-center py-20 bg-white rounded-2xl border border-gray-200 border-dashed">
                                                    <p className="text-gray-500 font-medium">All accounts are fully paid!</p>
                                                </div>
                                            ) : (
                                                payableOrders.map((order, index) => {
                                                    const isExpanded = expandedPOs[order.poNumber];
                                                    
                                                    return (
                                                    <div key={index} className={`expandable-card scroll-mt-24 bg-white rounded-2xl border overflow-hidden transition-all duration-300 mb-6 ${isExpanded ? 'border-brand-200 ring-1 ring-brand-200 shadow-md' : 'border-gray-100 shadow-sm hover:shadow-md'}`}>
                                                        <div 
                                                            onClick={(e) => togglePO(order.poNumber, e)}
                                                            className="p-5 cursor-pointer hover:bg-gray-50/50 transition-colors"
                                                        >
                                                            <div className="flex items-center flex-wrap gap-2.5 mb-3">
                                                                <div className={`shrink-0 w-8 h-8 bg-gray-50 rounded-lg border border-gray-200 flex items-center justify-center text-brand-500 mr-2 transition-transform duration-300 ${isExpanded ? 'rotate-180 bg-brand-50 border-brand-100' : ''}`}>
                                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                                                </div>
                                                                
                                                                <span className="font-bold text-gray-900 text-xl tracking-tight">{order.poNumber}</span>
                                                                
                                                                <span className={`px-2.5 py-0.5 rounded text-[10px] sm:text-xs font-bold uppercase tracking-wider border shadow-sm ${order.paymentType === 'Pending Deposit' ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-rose-100 text-rose-700 border-rose-200'}`}>
                                                                    {order.paymentType}
                                                                </span>
                                                                
                                                                {order.brand && (
                                                                    <span className="px-2.5 py-0.5 rounded text-[10px] sm:text-xs font-semibold border border-indigo-100 bg-indigo-50 text-indigo-600 shadow-sm">
                                                                        {order.brand}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            
                                                            <div className="pl-12 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                                                <div className="flex-1">
                                                                    <div className="text-[13px] sm:text-sm text-gray-800 font-medium mb-1">
                                                                        <span className="text-gray-400 mr-1.5">Client(s):</span> 
                                                                        {order.uniqueClients?.length > 0 ? order.uniqueClients.join(', ') : "Unspecified"}
                                                                    </div>
                                                                    <div className="text-[11px] sm:text-xs text-gray-500 truncate mb-4">
                                                                        <span className="text-gray-400 mr-1.5">Contents:</span>
                                                                        {Array.from(new Set(order.items.map(i => i.itemDescription).filter(Boolean))).join(", ") || "No item descriptions"}
                                                                    </div>
                                                                    
                                                                    <div className="flex items-center px-3 py-1.5 rounded-lg bg-gray-50 border border-gray-200 text-gray-700 text-xs font-bold shadow-sm inline-flex">
                                                                        <svg className="w-3.5 h-3.5 mr-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                                        Due: {order.displayDate || "TBD"}
                                                                    </div>
                                                                </div>
                                                                
                                                                <div className="text-left md:text-right bg-rose-50/50 border border-rose-100 p-3 rounded-xl w-full md:w-auto">
                                                                    <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wider block mb-0.5">Amount Due</span>
                                                                    <span className="text-2xl font-bold text-rose-600">{fmtStr(order.amountDue)}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        {isExpanded && (
                                                            <div className="border-t border-gray-100 bg-gray-50/30 p-5 space-y-4">
                                                                {order.items.map((item, idx) => (
                                                                    <div key={idx} className="flex items-start bg-white p-4 rounded-xl border border-gray-100 shadow-sm gap-4">
                                                                        <div className="w-16 h-16 sm:w-24 sm:h-24 bg-gray-100 rounded-lg overflow-hidden border border-gray-200 shrink-0 flex items-center justify-center shadow-inner">
                                                                            {item.imageLink ? (
                                                                                <img src={item.imageLink} alt={item.sku} className="w-full h-full object-cover" onError={(e) => e.target.style.display = 'none'} />
                                                                            ) : (
                                                                                <svg className="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                                            )}
                                                                        </div>
                                                                        <div className="flex flex-col flex-1 min-w-0 justify-center h-full">
                                                                            <div className="text-[13px] sm:text-base font-semibold text-gray-900 flex items-center flex-wrap gap-2.5 mb-1.5">
                                                                                <span className="font-bold text-brand-600">{item.qty ? `${item.qty}x ` : ''}</span>
                                                                                {item.sku && <span className="font-mono text-[10px] sm:text-xs text-brand-600 bg-brand-50 px-2 py-0.5 rounded border border-brand-100">{item.sku}</span>}
                                                                                <span className="truncate">{item.itemDescription || "Unnamed Item"}</span>
                                                                            </div>
                                                                            
                                                                            {item.client && (
                                                                                <div className="text-xs text-gray-500 font-medium mb-2 truncate">
                                                                                    <span className="text-gray-400">For:</span> {item.client}
                                                                                </div>
                                                                            )}
                                                                            
                                                                            {isManager && (
                                                                                <div className="text-[11px] sm:text-xs text-gray-500 flex gap-2.5 flex-wrap items-center">
                                                                                    <span><span className="text-gray-400">Landed:</span> {fmtStr(item.landedUnitCost)}/ea</span>
                                                                                    <span className="text-gray-300">|</span>
                                                                                    <span className="font-semibold text-gray-700"><span className="text-gray-400 font-normal">Line Total:</span> {fmtStr(item.totalLandedCost)}</span>
                                                                                    <span className="text-gray-300">|</span>
                                                                                    <span className="text-blue-600 font-medium"><span className="text-blue-400">Ship Total:</span> {fmtStr(item.totalShipping)}</span>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })
                                        )}
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </main>

                    {showAuthModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                                <div className="p-6">
                                    <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-4 mx-auto">
                                        <svg className="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" /></svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-center text-gray-900 mb-1">Management Access</h3>
                                    <p className="text-sm text-center text-gray-500 mb-6">Enter passcode to unlock financial data.</p>
                                    
                                    <form onSubmit={handleLogin}>
                                        <input
                                            type="password"
                                            value={passcode}
                                            onChange={(e) => setPasscode(e.target.value)}
                                            className="w-full text-center tracking-widest text-lg py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-gray-900 mb-2"
                                            placeholder="••••••"
                                            autoFocus
                                        />
                                        {authError && <p className="text-red-500 text-xs text-center mb-4">{authError}</p>}
                                        <div className="flex space-x-3 mt-6">
                                            <button type="button" onClick={() => {setShowAuthModal(false); setAuthError(""); setPasscode("");}} className="flex-1 py-2.5 bg-white border border-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition">
                                                Cancel
                                            </button>
                                            <button type="submit" className="flex-1 py-2.5 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition">
                                                Unlock
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>

    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn(err));
            });
        }
    </script>
</body>
</html>
