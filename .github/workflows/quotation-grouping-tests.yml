name: Quotation table editor, builder and Sales Order checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'quotation-workspace.js'
      - 'quotation-workspace.css'
      - 'quotation-table-editor.js'
      - 'quotation-table-editor.css'
      - 'tests/quotation-table-editor.test.cjs'
      - 'tests/quotation-compact.test.cjs'
      - 'tests/quotation-workspace.test.cjs'
      - 'tests/quotation-grouping.test.cjs'
      - 'tests/quotation-discount-format.test.cjs'
      - 'tests/sales-order-deposit.test.cjs'
      - '.github/workflows/quotation-grouping-tests.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'quotation-workspace.js'
      - 'quotation-table-editor.js'
      - 'quotation-table-editor.css'
      - 'tests/quotation-table-editor.test.cjs'
      - 'tests/quotation-compact.test.cjs'
      - '.github/workflows/quotation-grouping-tests.yml'

jobs:
  grouping-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check workspace and in-table editor syntax
        run: node --check quotation-workspace.js && node --check quotation-table-editor.js
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test quotation editor, grouping and Sales Order deposits
        run: node --test tests/quotation-compact.test.cjs tests/quotation-table-editor.test.cjs tests/quotation-workspace.test.cjs tests/quotation-grouping.test.cjs tests/quotation-discount-format.test.cjs tests/sales-order-deposit.test.cjs
