name: Deluxe Arte Column B Image Extraction Tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract-deluxe-arte-column-b.py'
      - 'tests/test_deluxe_arte_column_b.py'
      - '.github/workflows/deluxe-arte-column-b-tests.yml'
  pull_request:
    paths:
      - 'scripts/extract-deluxe-arte-column-b.py'
      - 'tests/test_deluxe_arte_column_b.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10.0.0'
      - run: python -m unittest discover -s tests -p 'test_deluxe_arte_column_b.py' -v
