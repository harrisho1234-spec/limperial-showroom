name: Refresh photo search index
on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save sharp@0.34.4 papaparse@5.5.3
      - run: node scripts/build-photo-index.mjs
      - name: Commit image index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/photo-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh catalog visual signatures"
            git push
          fi
